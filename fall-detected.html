<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall Detected - ElderSafe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone" style="background:var(--red-light);">
  <div class="topbar">
    <a href="dashboard.html" class="back-btn">←</a>
    <h1>Fall Detected</h1>
  </div>
  <div class="screen center">
    <div style="font-size:54px;margin-top:10px;">⚠️</div>
    <p style="color:var(--red);font-weight:800;font-size:20px;">Possible Fall Detected</p>
    <p class="small">Are you okay?</p>
    <p class="small">SOS will be sent in:</p>

    <div class="ring-wrap">
      <div class="ring">
        <span class="count" id="countNum">30</span>
        <span class="count-label">seconds</span>
      </div>
    </div>

    <button class="btn btn-green mb" onclick="imOk()">✔ I'm OK</button>
    <button class="btn btn-red" onclick="sendSOS()">🆘 Send SOS Now</button>
  </div>
</div>

<script src="js/app.js"></script>
<script>
requireAuth();
const settings = getSettings();
let seconds = settings.countdown || 30;
document.getElementById("countNum").textContent = seconds;

const timer = setInterval(() => {
  seconds--;
  document.getElementById("countNum").textContent = seconds;
  if (seconds <= 0) {
    clearInterval(timer);
    sendSOS();
  }
}, 1000);

function imOk() {
  clearInterval(timer);
  window.location.href = "dashboard.html";
}
function sendSOS() {
  clearInterval(timer);
  addAlert({
    type: "Fall Alert",
    icon: "fall",
    time: formatNow(),
    status: "Sent"
  });
  window.location.href = "sos-sent.html";
}
</script>
</body>
</html>
